services:
  subdown:
    build: .
    container_name: subdown
    ports:
      - "8000:8000"
    environment:
      RATE_LIMIT_PER_MINUTE: "20"
      MAX_CONCURRENT_JOBS: "3"
      FILE_TTL_SECONDS: "900"
      SUBDOWN_TEMP_DIR: "/tmp"
      CORS_ORIGINS: "*"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
